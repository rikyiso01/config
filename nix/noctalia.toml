[theme]
mode = "dark"

[shell]
polkit_agent = true

[bar.default]
position = "top"
start = ["workspaces"]
center = ["clock"]
end = [
  "volume",
  "mic",
  "cpu",
  "ram",
  "swap",
  "brightness",
  "battery",
  "network",
  "power_profile",
  "bluetooth",
  "tray",
]

[audio]
enable_overdrive = true

[widget.clock]
format = "%a, %d %b, %H:%M"

[widget.mic]
type = "volume"
device = "input"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

[widget.swap]
type = "sysmon"
stat = "swap_pct"

[brightness]
enable_ddcutil = true

[battery]
warning_threshold = 30

[location]
auto_locate = true

[calendar]
enabled = true

[calendar.account.personal]
type = "caldav"
name = "Personal"
provider = "custom"
server_url = "http://127.0.0.1:5232"
username = "t"
credential_source = "file"
password_file = "~/.config/.noctalia-calendar"

[nightlight]
enabled = true
force = true
temperature_day = 3700
temperature_night = 3700

[hooks]
started = "~/.local/bin/startup.sh"
battery_charging = "noctalia msg power-set balanced"
battery_discharging = "noctalia msg power-set power-saver; noctalia msg brightness-set 15%"


[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = false
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 150.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = false
        show_unlock_hint = true
        show_weather = true

